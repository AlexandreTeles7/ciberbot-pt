# Configuração usada pela demonstração e pelos testes (dados fictícios, sem rede).
[geral]
titulo = "CiberBot PT — Pré-visualização (dados de exemplo)"
fuso_horario = "Europe/Lisbon"
janela_horas = 36
max_itens = 25
max_por_fonte = 8
ordem_seccoes = ["portugal", "exploradas", "criticas", "noticias"]

[limites]
portugal = 6
exploradas = 8
criticas = 6
noticias = 10

[traducao]
ativa = true
lote = 4

[[fontes]]

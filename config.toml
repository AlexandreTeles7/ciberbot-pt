# CiberBot PT — configuração
# Todos os textos e limites podem ser alterados aqui, sem mexer no código.

[geral]
titulo = "CiberBot PT — Resumo diário de cibersegurança"
fuso_horario = "Europe/Lisbon"
janela_horas = 36          # só entram itens publicados nas últimas X horas
max_itens = 25             # máximo de destaques por edição
max_por_fonte = 8          # máximo por fonte (cada fonte pode ter o seu "max_itens")
estado = "state/vistos.json"
ordem_seccoes = ["portugal", "exploradas", "criticas", "noticias"]

[limites]                  # máximo de itens por secção
portugal = 6
exploradas = 8
criticas = 6
noticias = 10

[web]
ativo = true
pasta = "docs"             # o GitHub Pages serve esta pasta
url_publica = "https://alexandreteles7.github.io/ciberbot-pt/"   # aparece nas mensagens ("Ver no site")

[traducao]
ativa = true
modelo = "claude-haiku-5-5"   # pode ser substituído pela variável CIBERBOT_MODELO
lote = 8                      # itens por pedido à API
resumo_max_caracteres = 380

# --------------------------------------------------------------------------------------
# FONTES
#   tipo: "rss" (RSS ou Atom), "kev" (catálogo CISA) ou "nvd" (CVE críticos do NIST)
#   idioma: "pt" (não traduz) ou "en" (traduz para PT-PT)
#   categoria: portugal | exploradas | criticas | noticias  (define a secção)
#   peso: importância base da fonte na ordenação
# Se uma fonte falhar, as outras continuam e a falha aparece nas notas da edição.
# --------------------------------------------------------------------------------------

[[fontes]]
nome = "CNCS — Alertas de Segurança"
tipo = "rss"
url = "https://www.cncs.gov.pt/docs/alertas-seguranca/feed-rss/index.xml"
idioma = "pt"
categoria = "portugal"
peso = 40

# Blogue português de segurança (feed WordPress padrão — confirma que responde antes de depender dele).
[[fontes]]
nome = "Segurança Informática"
tipo = "rss"
url = "https://seguranca-informatica.pt/feed/"
idioma = "pt"
categoria = "portugal"
peso = 20
max_itens = 4

[[fontes]]
nome = "CISA — Vulnerabilidades exploradas (KEV)"
tipo = "kev"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
idioma = "en"
categoria = "exploradas"
peso = 60
max_itens = 8

[[fontes]]
nome = "NVD — CVE críticos"
tipo = "nvd"
url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
idioma = "en"
categoria = "criticas"
peso = 30
max_itens = 6

[[fontes]]
nome = "BleepingComputer"
tipo = "rss"
url = "https://www.bleepingcomputer.com/feed/"
idioma = "en"
categoria = "noticias"
peso = 25

[[fontes]]
nome = "The Hacker News"
tipo = "rss"
url = "https://feeds.feedburner.com/TheHackersNews"
idioma = "en"
categoria = "noticias"
peso = 25

[[fontes]]
nome = "Krebs on Security"
tipo = "rss"
url = "https://krebsonsecurity.com/feed/"
idioma = "en"
categoria = "noticias"
peso = 25
max_itens = 3


# Termos que aumentam a pontuação (procura por palavra inteira, sem distinguir maiúsculas).
[palavras_chave]
"zero-day" = 25
"0-day" = 25
"dia zero" = 25
"actively exploited" = 20
"exploited in the wild" = 20
"exploração ativa" = 20
"ransomware" = 15
"supply chain" = 12
"cadeia de fornecimento" = 12
"remote code execution" = 12
"execução remota de código" = 12
"data breach" = 10
"fuga de dados" = 10
"ciberataque" = 8
"backdoor" = 8
"critical" = 6
"crítica" = 6
"phishing" = 3
"portugal" = 20
"português" = 10
"portuguesa" = 10
"cncs" = 10
